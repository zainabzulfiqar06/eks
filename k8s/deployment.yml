apiVersion: apps/v1
kind: Deployment
metadata:
  name: face-crop
  namespace: my-namespace
  labels:
    app: face-crop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: face-crop
  template:
    metadata:
      labels:
        app: face-crop
    spec:
      containers:
      - name: face-crop
        image: 497713065171.dkr.ecr.eu-west-3.amazonaws.com/face-crop
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        imagePullSecrets:
      - name: ecr-registry-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
