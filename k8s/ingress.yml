apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: face-crop-ingress
  namespace: default
  annotations:
     alb.ingress.kubernetes.io/scheme: internet-facing
     alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: wearitall-be.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: face-crop-service
                port:
                  number: 80

